<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" />
    <!-- favicon.ico is the original 48×48 mark from the v5 dashboard; the SVG
         is the same artwork and wins in browsers that support it. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/aide-logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.ico" />
    <title>Aide</title>
    <!-- The app's canvas colour, so the gap before the stylesheet loads is the
         background the app is about to paint rather than white. The loading
         mark itself lives in `AnimatedLogo` and is rendered by the router. -->
    <style>
      html {
        background: #fafafa;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
